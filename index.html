<!DOCTYPE html>
<html lang="de" class="no-js">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="Author" content="IT Deutschland">
		<title>IT Deutschland – Wartungsarbeiten</title>
		<meta name="description" content="IT Deutschland – Wir sind gleich zurück." />
		<link rel="shortcut icon" href="img/Runde-Logo.png">
		<!-- Bootstrap 5 -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Open+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
		<link rel="stylesheet" type="text/css" href="css/normalize.css" />
		<link rel="stylesheet" type="text/css" href="css/styles.css">
	</head>
	<body id="home">

		<!-- Animated canvas background -->
		<div id="large-header" class="large-header">
			<canvas id="demo-canvas"></canvas>
		</div>

		<!-- Floating particles overlay -->
		<canvas id="particles-canvas"></canvas>

		<!-- Main content -->
		<div id="Content">
			<div class="maintenance-container">

				<!-- Runde-Logo spinning on load -->
			
				<!-- Main Logo with pulse effect -->
				<div id="main-logo-wrapper">
					<img id="main-logo" src="Logo.png" alt="IT Deutschland Logo" />
				</div>

				<!-- Maintenance text -->
				<div class="maintenance-text fade-in-up">
					<h1 class="maintenance-title">Wartungsarbeiten</h1>
					<p class="maintenance-sub">Wir führen derzeit Wartungsarbeiten durch.<br>Wir sind bald wieder für Sie da!</p>
					<div class="maintenance-divider"></div>
					<p class="maintenance-info">
						Unser Team arbeitet mit Hochdruck daran, die Website zu verbessern.<br>
						Vielen Dank für Ihre Geduld.
					</p>
				</div>

				<!-- Social icons -->
				<div id="socialIcons" class="fade-in-up delay-3">
					<ul>
						<li><a href="" title="Twitter" class="twitterIcon"></a></li>
						<li><a href="" title="Facebook" class="facebookIcon"></a></li>
						<li><a href="" title="LinkedIn" class="linkedInIcon"></a></li>
					</ul>
				</div>

				<span class="tempBy fade-in-up delay-4">&copy; 2024 IT Deutschland – Alle Rechte vorbehalten.</span>
			</div>
		</div>

		<!-- Scripts -->
		<script src="js/TweenLite.min.js"></script>
		<script src="js/EasePack.min.js"></script>
		<script src="js/rAF.js"></script>
		<script src="js/demo-1.js"></script>
		<script src="js/jquery-1.9.1.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="js/global.js"></script>
	</body>
</html>
